        const select = document.getElementById("teacherSelect");
        Object.keys(teacherData).sort().forEach(teacher => {
            let opt = document.createElement("option");
            opt.value = teacher;
            opt.textContent = teacher;
            select.appendChild(opt);
        });

        window.onload = function() {
            let savedTeacher = localStorage.getItem("activeTeacherSession");
            if (savedTeacher && teacherData[savedTeacher]) {
                select.value = savedTeacher;
                loadTeacherData();
            }
        };

        function loadTeacherData() {
            const teacher = select.value;
            const content = document.getElementById("portalContent");
            if (!teacher) {
                content.style.display = "none";
                localStorage.removeItem("activeTeacherSession");
                return;
            }
            localStorage.setItem("activeTeacherSession", teacher);
            content.style.display = "block";
            renderCBPs(teacher);
        }

        async function renderCBPs(teacher) {
            const pendingDiv = document.getElementById("pendingCbpList");
            const completedUl = document.getElementById("completedCbpList");
            
            pendingDiv.innerHTML = "<p class='text-xs text-slate-500'>Syncing from database...</p>";
            completedUl.innerHTML = "";

            let cbps = teacherData[teacher] || [];
            
            // Fetch submissions from Supabase Database
            const { data: dbRecords } = await supabaseClient
                .from('certificates')
                .select('cbp_title')
                .eq('teacher_name', teacher);

            let completed = dbRecords ? dbRecords.map(r => r.cbp_title) : [];
            let pendingCount = 0;
            pendingDiv.innerHTML = "";

            cbps.forEach((cbp, index) => {
                if (completed.includes(cbp)) {
                    let li = document.createElement("li");
                    li.innerHTML = `<strong>${cbp}</strong> <span class="text-emerald-600 font-semibold ml-2">✅ Submitted</span>`;
                    completedUl.appendChild(li);
                } else {
                    pendingCount++;
                    let card = document.createElement("div");
                    card.className = "bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-3 shadow-sm";
                    card.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-800 text-sm sm:text-base">${cbp}</p>
                            <div id="msg_${index}" class="text-xs font-semibold mt-1"></div>
                        </div>
                        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                            <input type="file" id="file_${index}" accept=".pdf" class="text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                            <button id="btn_${index}" onclick="verifyAndUpload('${teacher.replace(/'/g, "\\'")}', '${cbp.replace(/'/g, "\\'")}', ${index})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg text-xs sm:text-sm transition shadow">Verify & Upload</button>
                        </div>
                    `;
                    pendingDiv.appendChild(card);
                }
            });

            if (pendingCount === 0) {
                pendingDiv.innerHTML = "<p class='text-emerald-700 font-bold text-sm bg-emerald-50 p-4 rounded-xl text-center'>🎉 All modules verified & submitted successfully!</p>";
            }
            if (completed.length === 0) {
                completedUl.innerHTML = "<li class='text-slate-400 list-none'>No certificates submitted yet.</li>";
            }
        }

        async function verifyAndUpload(teacherName, cbpTitle, index) {
            const fileInput = document.getElementById(`file_${index}`);
            const msgDiv = document.getElementById(`msg_${index}`);
            const btn = document.getElementById(`btn_${index}`);

            if (!fileInput || fileInput.files.length === 0) {
                msgDiv.className = "text-xs font-semibold text-red-600";
                msgDiv.textContent = "❌ Please select a PDF certificate first.";
                return;
            }

            const file = fileInput.files[0];
            if (file.type !== "application/pdf") {
                msgDiv.className = "text-xs font-semibold text-red-600";
                msgDiv.textContent = "❌ Only PDF files are allowed.";
                return;
            }

            msgDiv.className = "text-xs font-semibold text-amber-600";
            msgDiv.textContent = "🔍 Scanning PDF content...";
            btn.disabled = true;

            let pdf = null;
            try {
                const arrayBuffer = await file.arrayBuffer();
                pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    fullText += textContent.items.map(item => item.str).join(" ") + " ";
                    if (page.cleanup) page.cleanup();
                }

                const pdfContentLower = fullText.toLowerCase();
                const searchName = teacherName.toLowerCase().trim();
                const nameMatched = pdfContentLower.includes(searchName);

                const titleWords = cbpTitle.toLowerCase().split(/\s+/).filter(w => w.length > 2);
                let matchedWordsCount = 0;
                titleWords.forEach(word => {
                    if (pdfContentLower.includes(word)) matchedWordsCount++;
                });
                const titleMatched = (titleWords.length === 0) || (matchedWordsCount >= Math.min(2, titleWords.length));

                if (pdf.destroy) pdf.destroy();

                if (nameMatched && titleMatched) {
                    msgDiv.className = "text-xs font-semibold text-amber-600";
                    msgDiv.textContent = "☁️ Uploading to Supabase Cloud...";

                    // Automatic Folder Path in Storage Bucket
                    const filePath = `${teacherName}/${cbpTitle}_${file.name}`;

                    // 1. Upload File to Supabase Storage
                    const { error: storageError } = await supabaseClient.storage
                        .from('teacher-certificates')
                        .upload(filePath, file, { upsert: true });

                    if (storageError) {
                        msgDiv.className = "text-xs font-semibold text-red-600";
                        msgDiv.textContent = "❌ Storage Error: " + storageError.message;
                        btn.disabled = false;
                        return;
                    }

                    // 2. Get Public URL
                    const { data: { publicUrl } } = supabaseClient.storage
                        .from('teacher-certificates')
                        .getPublicUrl(filePath);

                    // 3. Save Record in Supabase Database Table
                    const { error: dbError } = await supabaseClient
                        .from('certificates')
                        .insert([{ teacher_name: teacherName, cbp_title: cbpTitle, file_url: publicUrl }]);

                    if (dbError) {
                        msgDiv.className = "text-xs font-semibold text-red-600";
                        msgDiv.textContent = "❌ Database Error: " + dbError.message;
                        btn.disabled = false;
                    } else {
                        msgDiv.className = "text-xs font-semibold text-emerald-600";
                        msgDiv.textContent = "✅ Successfully Verified & Saved!";
                        setTimeout(() => renderCBPs(teacherName), 1500);
                    }

                } else {
                    let errorReason = !nameMatched ? "Verification Failed: Name not found in PDF." : "Verification Failed: Certificate title doesn't match.";
                    msgDiv.className = "text-xs font-semibold text-red-600";
                    msgDiv.textContent = `❌ ${errorReason}`;
                    btn.disabled = false;
                }

            } catch (err) {
                if (pdf && pdf.destroy) pdf.destroy();
                msgDiv.className = "text-xs font-semibold text-red-600";
                msgDiv.textContent = "❌ Error reading PDF file.";
                btn.disabled = false;
            }
        }
